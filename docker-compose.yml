services:
  postgres:
    image: postgres:16-alpine
    container_name: refref-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refref
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refref-webapp
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/refref
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-secret-key-change-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        cd /app &&
        pnpm -F @refref/coredb db:push &&
        pnpm -F @refref/coredb db:seed &&
        cd /app/apps/webapp &&
        pnpm start
      "

  refer:
    build:
      context: .
      dockerfile: Dockerfile.refer
    container_name: refref-refer
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/refref
      # The image ships prod deps only, so pino-pretty is absent and the logger
      # must stay in JSON mode.
      NODE_ENV: production
      PORT: 3002
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REFER_BASE_PATH: ${REFER_BASE_PATH:-/refer}
      # Must be the origin this container is reachable on, since /:code is
      # served at the root and the /join page hands these links out.
      REFERRAL_HOST_URL: ${REFERRAL_HOST_URL:-http://localhost:3002}
      WELFIE_SIGNUP_URL: ${WELFIE_SIGNUP_URL:-http://localhost:3000/auth/sign-up}
      REFERRAL_CONSENT_VERSION: ${REFERRAL_CONSENT_VERSION:-privacy-2026-08}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-http://localhost:3000/privacy}
      HANDOFF_TTL_MINUTES: ${HANDOFF_TTL_MINUTES:-10}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: